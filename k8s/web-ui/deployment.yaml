apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-config
  namespace: kitchen-app
data:
  nginx.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Same-origin API proxy (works in Docker Compose + Kubernetes)
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://api:3000/;
        }

        location /health {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <title>Kitchen Orders Dashboard</title>

    <style>
    body {
      background: #f4f6fb;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      color: #333;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #2563eb;
    }

    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .delete {
      background: #ef4444;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .stats {
      font-weight: bold;
    }

    .loading {
      color: orange;
    }

    .empty {
      text-align: center;
      color: #888;
      margin-top: 10px;
    }
    </style>
    </head>

    <body>

    <h1>🍽️ Kitchen Orders Dashboard</h1>

    <div class="container">

      <!-- LEFT -->
      <div class="card">
        <p>API Status: <span id="status">Checking...</span></p>

        <input id="dish" placeholder="Enter dish">
        <button onclick="createOrder(event)">Create</button>

        <p id="msg"></p>
      </div>

      <!-- RIGHT -->
      <div class="card">

        <div class="top-bar">
          <div class="stats">Total Orders: <span id="count">0</span></div>
          <input id="search" placeholder="Search..." onkeyup="filterOrders()">
        </div>

        <button onclick="loadOrders()">Refresh</button>

        <p id="loading"></p>

        <table width="100%">
          <thead>
            <tr>
              <th>Dish</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders"></tbody>
        </table>

        <div id="empty" class="empty"></div>

      </div>

    </div>

    <script>

    let allOrders = [];

    async function checkHealth(){
      try {
        await fetch("/api/health");
        document.getElementById("status").innerText = "OK ✅";
      } catch {
        document.getElementById("status").innerText = "DOWN ❌";
      }
    }

    async function loadOrders(){
      document.getElementById("loading").innerText = "Loading...";

      try {
        const res = await fetch("/api/orders");
        const data = await res.json();

        allOrders = data;
        renderOrders(data);

        document.getElementById("count").innerText = data.length;

        if(data.length === 0){
          document.getElementById("empty").innerText = "No orders yet 📭";
        } else {
          document.getElementById("empty").innerText = "";
        }

      } catch {
        document.getElementById("orders").innerHTML = "";
        document.getElementById("empty").innerText = "❌ Failed to load data";
      }

      document.getElementById("loading").innerText = "";
    }

    function renderOrders(data){
      let html = "";

      data.forEach(o=>{
        html += `<tr>
          <td>${o.dish}</td>
          <td>
            <button class="delete" onclick="deleteOrder('${o._id}')">Delete</button>
          </td>
        </tr>`;
      });

      document.getElementById("orders").innerHTML = html;
    }

    function filterOrders(){
      const keyword = document.getElementById("search").value.toLowerCase();

      const filtered = allOrders.filter(o =>
        o.dish.toLowerCase().includes(keyword)
      );

      renderOrders(filtered);
    }

    async function createOrder(event){
      const btn = event.target;
      btn.disabled = true;

      const dish = document.getElementById("dish").value;

      if(!dish){
        alert("Enter dish name");
        btn.disabled = false;
        return;
      }

      try {
        const res = await fetch("/api/orders", {
          method:"POST",
          headers:{ "Content-Type":"application/json"},
          body: JSON.stringify({dish})
        });

        if(!res.ok) throw new Error();

        document.getElementById("msg").innerText = "✅ Order Created!";
        loadOrders();

      } catch {
        document.getElementById("msg").innerText = "❌ Failed!";
      }

      document.getElementById("dish").value = "";
      btn.disabled = false;
    }

    async function deleteOrder(id){
      await fetch("/api/orders/"+id, { method:"DELETE" });
      loadOrders();
    }

    // Enter key support
    document.getElementById("dish").addEventListener("keypress", function(e){
      if(e.key === "Enter"){
        createOrder({target: document.querySelector("button")});
      }
    });

    // Auto refresh
    setInterval(loadOrders, 5000);

    checkHealth();
    loadOrders();

    </script>

    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-ui-deployment, namespace: kitchen-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: kitchen-web-ui } }
  template:
    metadata: { labels: { app: kitchen-web-ui } }
    spec:
      containers:
        - name: kitchen-web-ui
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          livenessProbe:  { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 5 }
          volumeMounts:
            - name: web-ui-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: web-ui-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests: { memory: '32Mi', cpu: '25m' }
            limits:   { memory: '64Mi', cpu: '100m' }
      volumes:
        - name: web-ui-config
          configMap:
            name: web-ui-config
---
apiVersion: v1
kind: Service
metadata: { name: web-ui-service, namespace: kitchen-app }
spec:
  type: NodePort
  selector: { app: kitchen-web-ui }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]